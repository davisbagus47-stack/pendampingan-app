[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[fmt]
line_length = 120
multiline_func_header = "params_first"

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1000 }
